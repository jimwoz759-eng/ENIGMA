# ╔══════════════════════════════════════════════════════════════════╗
# ║  EnigmaHardwareID — GitHub Actions CI/CD                       ║
# ║  平台：Win32 (x86)  工具集：v143(VS2022)                       ║
# ║  MFC：动态 (_AFXDLL)  字符集：MBCS  依赖：spdlog (vcpkg)       ║
# ║  /Wall 全量警告 + 日志文件作为 Artifact 上传                    ║
# ╚══════════════════════════════════════════════════════════════════╝

name: Build EnigmaHardwareID

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Win32 / ${{ matrix.config }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      # ── 1. 拉取代码 ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. MSBuild 到 PATH ───────────────────────────────────────
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── 3. 缓存 vcpkg ───────────────────────────────────────────
      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x86-windows-${{ hashFiles('EnigmaHardwareID/vcpkg.json') }}
          restore-keys: vcpkg-x86-windows-

      # ── 4. 安装 spdlog ──────────────────────────────────────────
      - name: Install vcpkg deps
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cd C:\vcpkg
          git pull --ff-only
          .\vcpkg install spdlog[wchar]:x86-windows
          .\vcpkg integrate install

      - name: vcpkg integrate (from cache)
        if: steps.cache-vcpkg.outputs.cache-hit == 'true'
        shell: pwsh
        run: C:\vcpkg\vcpkg integrate install

      # ── 5. 工具集 v141 → v143 ───────────────────────────────────
      - name: Patch PlatformToolset v141 → v143
        shell: pwsh
        run: |
          $f = "EnigmaHardwareID\EnigmaHardwareID.vcxproj"
          (Get-Content $f -Raw) `
            -replace '<PlatformToolset>v141</PlatformToolset>',
                     '<PlatformToolset>v143</PlatformToolset>' |
            Set-Content $f -Encoding UTF8
          Write-Host "Toolset patched to v143"

      # ── 6. 改用 spdlog 静态 triplet，彻底消除 fmt.dll 运行时依赖 ─
      #   x86-windows        → spdlog/fmt 动态链接（需要 fmt.dll）❌
      #   x86-windows-static → spdlog/fmt 全部静态链入 .exe         ✅
      #   同时把 CRT 也静态链接（/MT），这样 .exe 在无 VC 运行时的机器也能跑
      - name: Reinstall spdlog as static triplet
        shell: pwsh
        run: |
          # 重新安装静态版本（首次会编译，命中缓存则秒完）
          C:\vcpkg\vcpkg install spdlog[wchar]:x86-windows-static --recurse
          C:\vcpkg\vcpkg integrate install
          Write-Host "spdlog static installed"

      # ── 7. 注入 /Wall + /WX- + /MT(d) 到 vcxproj ───────────────
      #   /Wall  ：开启所有警告（含 CRT/STL 内部警告，噪音较多）
      #   /WX-   ：警告不转错误，保证有警告时编译仍能出产物
      #   /MT(d) ：静态链接 CRT，与 x86-windows-static triplet 匹配
      #   /wd    ：屏蔽 MFC/STL/spdlog 自身噪音警告
      #     4100 未引用形参  4127 常量条件  4191 不安全转换
      #     4242/4244 截断  4514 内联删除  4571 catch(...)语义
      #     4619 pragma警告号不存在  4625/4626/5026/5027 特殊成员
      #     4668 未定义宏当0  4710/4711 内联决策  4820 结构体填充
      #     4946 reinterpret_cast  5045 Spectre缓解建议
      - name: Inject /Wall + static CRT + x86-windows-static into vcxproj
        shell: pwsh
        run: |
          $f    = "EnigmaHardwareID\EnigmaHardwareID.vcxproj"
          $xml  = Get-Content $f -Raw

          # 1) 警告开关
          $wall = '/Wall /WX- /wd4100 /wd4127 /wd4191 /wd4242 /wd4244 ' +
                  '/wd4514 /wd4571 /wd4619 /wd4625 /wd4626 /wd4668 ' +
                  '/wd4710 /wd4711 /wd4820 /wd4946 /wd5026 /wd5027 /wd5045 ' +
                  '%(AdditionalOptions)'
          $xml = $xml -replace '/utf-8 %\(AdditionalOptions\)', "/utf-8 $wall"

          # 2) CRT：Release → /MT，Debug → /MTd（与 x86-windows-static 匹配）
          $xml = $xml -replace '<RuntimeLibrary>MultiThreadedDLL</RuntimeLibrary>',
                               '<RuntimeLibrary>MultiThreaded</RuntimeLibrary>'
          $xml = $xml -replace '<RuntimeLibrary>MultiThreadedDebugDLL</RuntimeLibrary>',
                               '<RuntimeLibrary>MultiThreadedDebug</RuntimeLibrary>'
          # 若原文件没有 RuntimeLibrary 节点则在 ClCompile 末尾补上
          if ($xml -notmatch '<RuntimeLibrary>') {
            $xml = $xml -replace '(<ClCompile>)', '$1<RuntimeLibrary Condition="''$(Configuration)''==''Release''">MultiThreaded</RuntimeLibrary><RuntimeLibrary Condition="''$(Configuration)''==''Debug''">MultiThreadedDebug</RuntimeLibrary>'
          }

          # 3) vcpkg triplet → static
          $xml = $xml -replace '<VcpkgTriplet>x86-windows</VcpkgTriplet>',
                               '<VcpkgTriplet>x86-windows-static</VcpkgTriplet>'

          Set-Content $f $xml -Encoding UTF8
          Write-Host "/Wall + static CRT + static triplet injected"

      # ── 8. 编译，日志同时输出到终端和文件 ───────────────────────
      #   /v:detailed  ：完整详细日志（含每个 cl.exe 命令行参数）
      #   Tee-Object   ：实时显示在 Actions 面板，同时落盘到 .log
      #   ⚠ 不能同时用 /flp 和 Tee-Object 写同一文件 → 文件锁冲突
      #   $pipeStat    ：PowerShell 7 管道各段退出码数组，[0] 是 msbuild
      - name: Build ${{ matrix.config }}|Win32
        shell: pwsh
        run: |
          $logFile = "build-${{ matrix.config }}.log"
          msbuild EnigmaHardwareID.sln `
            /p:Configuration=${{ matrix.config }} `
            /p:Platform=Win32 `
            /m `
            /v:detailed `
            /nologo |
            Tee-Object -FilePath $logFile
          # $pipeStat[0] 是管道第一段（msbuild）的真实退出码
          exit $pipeStat[0].ExitCode

      # ── 9. 从日志提取 warning/error 摘要并打印到 Actions 面板 ──
      #   即使编译失败也运行（if: always()），方便排错
      - name: Print warnings & errors summary
        if: always()
        shell: pwsh
        run: |
          $logFile = "build-${{ matrix.config }}.log"
          if (-not (Test-Path $logFile)) {
            Write-Host "Log file not found, skipping summary."
            exit 0
          }
          $lines = Get-Content $logFile -Encoding UTF8
          $hits  = $lines | Where-Object {
            $_ -match '\s(warning|error)\s+C\d{4}' -or
            $_ -match '^\s*(.*\.(?:cpp|h|rc))\(\d+\).*(?:warning|error)'
          }
          if ($hits) {
            Write-Host "══════════ ⚠ Warning / Error Summary ══════════"
            $hits | ForEach-Object { Write-Host $_ }
            Write-Host "════════════════════════════════════════════════"
            Write-Host "Total: $($hits.Count) line(s)"
          } else {
            Write-Host "✅ No warnings or errors found."
          }

      # ── 10. 确认产物路径 ─────────────────────────────────────────
      - name: Show output files
        if: success()
        shell: pwsh
        run: |
          $dir = "bin\${{ matrix.config }}"
          if (Test-Path $dir) {
            Get-ChildItem $dir | Select-Object Name, Length
          } else {
            Write-Host "Output dir not found: $dir"; exit 1
          }

      # ── 11. 打印 bin 目录完整文件清单（确认无遗漏 dll）────────────
      - name: List bin directory
        if: always()
        shell: pwsh
        run: |
          $dir = "bin\${{ matrix.config }}"
          if (Test-Path $dir) {
            Write-Host "── 产物目录：$dir ──"
            Get-ChildItem $dir -Recurse |
              Select-Object Name, @{N='KB';E={[math]::Round($_.Length/1KB,1)}} |
              Format-Table -AutoSize
          } else {
            Write-Host "bin 目录不存在（编译失败）"
          }

      # ── 12. 上传编译产物（静态链接，单 exe 无 dll 依赖）+ 日志 ──
      - name: Upload artifact + build log
        if: always()      # 编译失败时日志更重要，照样上传
        uses: actions/upload-artifact@v4
        with:
          name: EnigmaHardwareID-Win32-${{ matrix.config }}
          path: |
            bin/${{ matrix.config }}/EnigmaHardwareID.exe
            build-${{ matrix.config }}.log
          if-no-files-found: warn
          retention-days: 90
