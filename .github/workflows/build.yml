# ╔══════════════════════════════════════════════════════════════════╗
# ║  EnigmaHardwareID — GitHub Actions CI/CD                       ║
# ║  平台：Win32 (x86)  工具集：v143(VS2022)                       ║
# ║  MFC：动态 (_AFXDLL)  字符集：MBCS  依赖：spdlog (vcpkg)       ║
# ╚══════════════════════════════════════════════════════════════════╝

name: Build EnigmaHardwareID

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build (Win32 / ${{ matrix.config }})
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      # ── 1. 拉取代码 ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. 安装 MFC ─────────────────────────────────────────────
      #   windows-2022 runner 自带完整 VS2022 Enterprise，
      #   只需用 vs_installer 补装 MFC 组件即可，无需重装 BuildTools
      - name: Install MFC component
        shell: pwsh
        run: |
          # 找到完整 VS（Enterprise/Professional/Community），排除 BuildTools
          $vsPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -requires Microsoft.VisualStudio.Workload.NativeDesktop `
            -property installationPath
          if (-not $vsPath) {
            # fallback：取任意最新安装
            $vsPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -property installationPath
          }
          Write-Host "VS installationPath: $vsPath"

          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $installer modify `
            --installPath "$vsPath" `
            --add Microsoft.VisualStudio.Component.VC.MFC.x86.x64 `
            --quiet --norestart --force
          Write-Host "MFC install exit: $LASTEXITCODE"

          # 验证 MFC 头文件确实存在
          $mfcH = Join-Path $vsPath "VC\Tools\MSVC" | Get-ChildItem -Directory |
            Select-Object -Last 1 |
            ForEach-Object { Join-Path $_.FullName "atlmfc\include\afxwin.h" }
          if (Test-Path $mfcH) {
            Write-Host "✅ MFC verified: $mfcH"
          } else {
            Write-Host "❌ MFC header NOT found at expected path"
            # 搜索实际位置供调试
            Get-ChildItem "C:\Program Files (x86)\Microsoft Visual Studio" -Recurse -Filter "afxwin.h" -ErrorAction SilentlyContinue |
              Select-Object -First 5 | ForEach-Object { Write-Host "  Found: $_" }
          }

      # ── 3. 设置 MSBuild 路径（指向完整 VS，非 BuildTools） ──────
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          vs-prerelease: false
          msbuild-architecture: x86

      # ── 4. 缓存 vcpkg ───────────────────────────────────────────
      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-win32-spdlog-${{ hashFiles('EnigmaHardwareID/vcpkg.json') }}
          restore-keys: |
            vcpkg-win32-spdlog-

      # ── 5. 安装 vcpkg 依赖 ──────────────────────────────────────
      - name: Install vcpkg dependencies
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cd C:\vcpkg
          git pull
          .\vcpkg install spdlog[wchar]:x86-windows --recurse
          .\vcpkg integrate install

      - name: vcpkg integrate (cached)
        if: steps.cache-vcpkg.outputs.cache-hit == 'true'
        shell: pwsh
        run: C:\vcpkg\vcpkg integrate install

      # ── 6. 工具集 v141 → v143 ───────────────────────────────────
      - name: Patch toolset v141 → v143
        shell: pwsh
        run: |
          $proj = "EnigmaHardwareID\EnigmaHardwareID.vcxproj"
          (Get-Content $proj) -replace 'v141', 'v143' | Set-Content $proj
          Write-Host "Toolset patched to v143"

      # ── 7. 执行构建 ─────────────────────────────────────────────
      - name: Build ${{ matrix.config }}
        shell: pwsh
        run: |
          msbuild EnigmaHardwareID.sln `
            /p:Configuration=${{ matrix.config }} `
            /p:Platform=Win32 `
            /p:VcpkgEnabled=true `
            /p:VcpkgEnableManifest=true `
            /p:VcpkgTriplet=x86-windows `
            /p:VcpkgManifestInstall=true `
            /m `
            /v:minimal `
            /nologo

      # ── 8. 上传产物（Release） ───────────────────────────────────
      - name: Upload artifact
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: EnigmaHardwareID-Win32-Release
          path: |
            EnigmaHardwareID\Release\EnigmaHardwareID.exe
            EnigmaHardwareID\Release\*.dll
          if-no-files-found: warn
          retention-days: 30
