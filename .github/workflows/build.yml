# ╔══════════════════════════════════════════════════════════════════╗
# ║  EnigmaHardwareID — GitHub Actions CI/CD                       ║
# ║  平台：Win32 (x86)  工具集：v143(VS2022)                       ║
# ║  MFC：动态 (_AFXDLL)  字符集：MBCS  依赖：spdlog (vcpkg)       ║
# ╚══════════════════════════════════════════════════════════════════╝

name: Build EnigmaHardwareID

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Win32 / ${{ matrix.config }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      # ── 1. 拉取代码 ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. 加 MSBuild 到 PATH ────────────────────────────────────
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── 3. 缓存 vcpkg 已安装包 ──────────────────────────────────
      #   key 绑定 vcpkg.json，依赖没变就直接复用缓存
      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x86-windows-${{ hashFiles('EnigmaHardwareID/vcpkg.json') }}
          restore-keys: vcpkg-x86-windows-

      # ── 4. 安装 spdlog（缓存未命中时才真正编译） ────────────────
      - name: Install vcpkg deps
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cd C:\vcpkg
          git pull --ff-only
          .\vcpkg install spdlog[wchar]:x86-windows
          .\vcpkg integrate install

      # 缓存命中也要 integrate，让 MSBuild 找到头文件和 .lib
      - name: vcpkg integrate (from cache)
        if: steps.cache-vcpkg.outputs.cache-hit == 'true'
        shell: pwsh
        run: C:\vcpkg\vcpkg integrate install

      # ── 5. 工具集 v141 → v143（runner 上只有 VS2022） ───────────
      - name: Patch PlatformToolset v141 → v143
        shell: pwsh
        run: |
          $f = "EnigmaHardwareID\EnigmaHardwareID.vcxproj"
          (Get-Content $f -Raw) -replace '<PlatformToolset>v141</PlatformToolset>',
                                          '<PlatformToolset>v143</PlatformToolset>' |
            Set-Content $f -Encoding UTF8
          Write-Host "Toolset patched"

      # ── 6. 编译 ─────────────────────────────────────────────────
      - name: Build ${{ matrix.config }}|Win32
        shell: pwsh
        run: |
          msbuild EnigmaHardwareID.sln `
            /p:Configuration=${{ matrix.config }} `
            /p:Platform=Win32 `
            /m `
            /v:minimal `
            /nologo

      # ── 7. 确认产物路径存在 ──────────────────────────────────────
      #   vcxproj 里 OutDir = $(SolutionDir)bin\$(Configuration)\
      #   → 相对 .sln 所在目录 = bin\Release\ 或 bin\Debug\
      - name: Show output files
        shell: pwsh
        run: |
          $dir = "bin\${{ matrix.config }}"
          if (Test-Path $dir) {
            Get-ChildItem $dir | Select-Object Name, Length
          } else {
            Write-Host "Output dir not found: $dir"
            exit 1
          }

      # ── 8. 上传产物 ──────────────────────────────────────────────
      - name: Upload ${{ matrix.config }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnigmaHardwareID-Win32-${{ matrix.config }}
          # vcxproj OutDir = $(SolutionDir)bin\$(Configuration)\
          path: bin/${{ matrix.config }}/EnigmaHardwareID.exe
          if-no-files-found: error   # 找不到 exe 就让 CI 明确失败
          retention-days: 90
