# ╔══════════════════════════════════════════════════════════════════╗
# ║  EnigmaHardwareID — GitHub Actions CI/CD                       ║
# ║  平台：Win32 (x86)  工具集：v143(VS2022)                       ║
# ║  MFC：动态 (_AFXDLL / /MD)  字符集：MBCS  依赖：spdlog (vcpkg) ║
# ║  /Wall 全量警告 + 日志文件作为 Artifact 上传                    ║
# ╚══════════════════════════════════════════════════════════════════╝

name: Build EnigmaHardwareID

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Win32 / ${{ matrix.config }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      # ── 1. 拉取代码 ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. MSBuild 到 PATH ───────────────────────────────────────
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── 3. 缓存 vcpkg ───────────────────────────────────────────
      #   key：动态 triplet x86-windows（与 _AFXDLL / /MD 匹配）
      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x86-windows-${{ hashFiles('EnigmaHardwareID/vcpkg.json') }}
          restore-keys: vcpkg-x86-windows-

      # ── 4. 安装 spdlog（动态 triplet，与 _AFXDLL / /MD 匹配）────
      #   _AFXDLL 要求运行时库为 /MD，必须使用 x86-windows（动态）
      #   不能使用 x86-windows-static（会引入 /MT，与 _AFXDLL 冲突）
      - name: Install vcpkg deps
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cd C:\vcpkg
          git pull --ff-only
          .\vcpkg install spdlog[wchar]:x86-windows
          .\vcpkg integrate install

      - name: vcpkg integrate (from cache)
        if: steps.cache-vcpkg.outputs.cache-hit == 'true'
        shell: pwsh
        run: C:\vcpkg\vcpkg integrate install

      # ── 5. 工具集 v141 → v143 ───────────────────────────────────
      - name: Patch PlatformToolset v141 → v143
        shell: pwsh
        run: |
          $f = "EnigmaHardwareID\EnigmaHardwareID.vcxproj"
          (Get-Content $f -Raw) `
            -replace '<PlatformToolset>v141</PlatformToolset>',
                     '<PlatformToolset>v143</PlatformToolset>' |
            Set-Content $f -Encoding UTF8
          Write-Host "Toolset patched to v143"

      # ── 6. 注入 /Wall 警告开关 ──────────────────────────────────
      #   /Wall  ：开启所有警告（含 CRT/STL 内部警告）
      #   /WX-   ：警告不转错误，保证有警告时编译仍能出产物
      #   /MD 已在 vcxproj 的 <RuntimeLibrary> 节点中声明，无需此处注入
      #   /wd    ：屏蔽 MFC/STL/spdlog 自身噪音警告
      #     4100 未引用形参  4127 常量条件  4191 不安全转换
      #     4242/4244 截断  4514 内联删除  4571 catch(...)语义
      #     4619 pragma警告号不存在  4625/4626/5026/5027 特殊成员
      #     4668 未定义宏当0  4710/4711 内联决策  4820 结构体填充
      #     4946 reinterpret_cast  5045 Spectre缓解建议
      - name: Inject /Wall warning flags into vcxproj
        shell: pwsh
        run: |
          $f   = "EnigmaHardwareID\EnigmaHardwareID.vcxproj"
          $xml = Get-Content $f -Raw

          $wall = '/Wall /WX- /wd4100 /wd4127 /wd4191 /wd4242 /wd4244 ' +
                  '/wd4514 /wd4571 /wd4619 /wd4625 /wd4626 /wd4668 ' +
                  '/wd4710 /wd4711 /wd4820 /wd4946 /wd5026 /wd5027 /wd5045 ' +
                  '%(AdditionalOptions)'
          $xml = $xml -replace '/utf-8 %\(AdditionalOptions\)', "/utf-8 $wall"

          Set-Content $f $xml -Encoding UTF8
          Write-Host "/Wall flags injected"

      # ── 7. 编译，日志同时输出到终端和文件 ───────────────────────
      #   /v:detailed  ：完整详细日志（含每个 cl.exe 命令行参数）
      #   Tee-Object   ：实时显示在 Actions 面板，同时落盘到 .log
      #   $pipeStat    ：PowerShell 7 管道各段退出码数组，[0] 是 msbuild
      - name: Build ${{ matrix.config }}|Win32
        shell: pwsh
        run: |
          $logFile = "build-${{ matrix.config }}.log"
          msbuild EnigmaHardwareID.sln `
            /p:Configuration=${{ matrix.config }} `
            /p:Platform=Win32 `
            /m `
            /v:detailed `
            /nologo |
            Tee-Object -FilePath $logFile
          exit $pipeStat[0].ExitCode

      # ── 8. 从日志提取 warning/error 摘要并打印到 Actions 面板 ──
      #   即使编译失败也运行（if: always()），方便排错
      - name: Print warnings & errors summary
        if: always()
        shell: pwsh
        run: |
          $logFile = "build-${{ matrix.config }}.log"
          if (-not (Test-Path $logFile)) {
            Write-Host "Log file not found, skipping summary."
            exit 0
          }
          $lines = Get-Content $logFile -Encoding UTF8
          $hits  = $lines | Where-Object {
            $_ -match '\s(warning|error)\s+C\d{4}' -or
            $_ -match '^\s*(.*\.(?:cpp|h|rc))\(\d+\).*(?:warning|error)'
          }
          if ($hits) {
            Write-Host "══════════ ⚠ Warning / Error Summary ══════════"
            $hits | ForEach-Object { Write-Host $_ }
            Write-Host "════════════════════════════════════════════════"
            Write-Host "Total: $($hits.Count) line(s)"
          } else {
            Write-Host "✅ No warnings or errors found."
          }

      # ── 9. 确认产物路径 ─────────────────────────────────────────
      - name: Show output files
        if: success()
        shell: pwsh
        run: |
          $dir = "bin\${{ matrix.config }}"
          if (Test-Path $dir) {
            Get-ChildItem $dir | Select-Object Name, Length
          } else {
            Write-Host "Output dir not found: $dir"; exit 1
          }

      # ── 10. 打印 bin 目录完整文件清单 ───────────────────────────
      - name: List bin directory
        if: always()
        shell: pwsh
        run: |
          $dir = "bin\${{ matrix.config }}"
          if (Test-Path $dir) {
            Write-Host "── 产物目录：$dir ──"
            Get-ChildItem $dir -Recurse |
              Select-Object Name, @{N='KB';E={[math]::Round($_.Length/1KB,1)}} |
              Format-Table -AutoSize
          } else {
            Write-Host "bin 目录不存在（编译失败）"
          }

      # ── 11. 上传编译产物 + 日志 ─────────────────────────────────
      - name: Upload artifact + build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EnigmaHardwareID-Win32-${{ matrix.config }}
          path: |
            bin/${{ matrix.config }}/EnigmaHardwareID.exe
            build-${{ matrix.config }}.log
          if-no-files-found: warn
          retention-days: 90
