# ╔══════════════════════════════════════════════════════════════════╗
# ║  EnigmaHardwareID — GitHub Actions CI/CD                       ║
# ║  平台：Win32 (x86)  工具集：v143(VS2022)                       ║
# ║  MFC：动态 (_AFXDLL)  字符集：MBCS  依赖：spdlog (vcpkg)       ║
# ╚══════════════════════════════════════════════════════════════════╝

name: Build EnigmaHardwareID

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build (Win32 / ${{ matrix.config }})
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      # ── 1. 拉取代码 ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. 安装 MFC（用 vs_buildtools，最可靠） ─────────────────
      - name: Install MFC via vs_buildtools
        shell: cmd
        run: |
          curl -fsSL -o vs_buildtools.exe https://aka.ms/vs/17/release/vs_buildtools.exe
          vs_buildtools.exe --quiet --wait --norestart --nocache ^
            --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 ^
            --add Microsoft.VisualStudio.Component.VC.MFC.x86.x64 ^
            --add Microsoft.VisualStudio.Component.Windows10SDK.20348
          echo MFC install exit: %ERRORLEVEL%

      # ── 3. 设置 MSBuild 路径 ────────────────────────────────────
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # ── 4. 缓存 vcpkg ───────────────────────────────────────────
      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-win32-spdlog-${{ hashFiles('EnigmaHardwareID/vcpkg.json') }}
          restore-keys: |
            vcpkg-win32-spdlog-

      # ── 5. 安装 vcpkg 依赖（spdlog:x86-windows） ────────────────
      - name: Install vcpkg dependencies
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cd C:\vcpkg
          git pull
          .\vcpkg install spdlog[wchar]:x86-windows --recurse
          .\vcpkg integrate install

      - name: vcpkg integrate (cached)
        if: steps.cache-vcpkg.outputs.cache-hit == 'true'
        shell: pwsh
        run: C:\vcpkg\vcpkg integrate install

      # ── 6. 工具集 v141 → v143 ───────────────────────────────────
      - name: Patch toolset v141 → v143
        shell: pwsh
        run: |
          $proj = "EnigmaHardwareID\EnigmaHardwareID.vcxproj"
          (Get-Content $proj) -replace 'v141', 'v143' | Set-Content $proj
          Write-Host "Toolset patched to v143"

      # ── 7. 执行构建 ─────────────────────────────────────────────
      - name: Build ${{ matrix.config }}
        shell: pwsh
        run: |
          msbuild EnigmaHardwareID.sln `
            /p:Configuration=${{ matrix.config }} `
            /p:Platform=Win32 `
            /p:VcpkgEnabled=true `
            /p:VcpkgTriplet=x86-windows `
            /m `
            /v:minimal `
            /nologo

      # ── 8. 上传产物（Release） ───────────────────────────────────
      - name: Upload artifact
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: EnigmaHardwareID-Win32-Release
          path: |
            EnigmaHardwareID\Release\EnigmaHardwareID.exe
            EnigmaHardwareID\Release\*.dll
          if-no-files-found: warn
          retention-days: 30
